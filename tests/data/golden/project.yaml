dataset: golden
data_root: .
adapters_dir: adapters
outputs_dir: ../../../outputs   # resolves to repo outputs/ (tests override this)
thresholds:
  run_on: 0.5
  min_full_physical_rows: 50
  min_nominal_rows: 50
  min_calibration_rows: 50
  validation_split: interleaved
  validation_fold: 3
  # This fixture is deliberately noise-free: P1's power is an exact cubic
  # in speed so the calibration assertion can demand near-exact recovery.
  # That is precisely the signature the synthetic-channel gate blocks on,
  # and correctly so for real BMS data, so the gate is disabled here.
  block_synthetic_targets: false
devices:
  - {id: CH1, type: chiller, adapter: chiller.yaml}
  - {id: P1, type: pump, adapter: pump.yaml}
  - {id: HX1, type: heat_exchanger, adapter: hex.yaml}
