  adapter: chiller_ch_06.yaml
- id: CH_07
  type: chiller
  adapter: chiller_ch_07.yaml
- id: CT_01
  type: cooling_tower
  adapter: cooling_tower_ct_01.yaml
  flow_attribution:
    # Site A hydraulic pairing: this tower is fed only by these
    # devices, so the flow is theirs by topology and needs no
    # solo-run argument (see pipeline/attribute.py).
    source_devices: [CH_01, HX_01]
    source_type_fallback: chiller
    source_column: cw_flow_m3_h
  join:
  - source_csv: WET_BALL/OUTDOOR/Local_IO.RF1-OUTDOOR_202405_202504_with_Twb.csv
    timestamp: DateTime
    column: Twb (°C)
    as: twb_C
  reconstruct:
    fans_on_count:
      method: active_count
      signals:
      - fan1_Hz
      - fan2_Hz
      threshold: 5.0
    heat_rejection_W:
      method: heat_rate
      flow: attributed_flow_m3_h
      t_hot: tcwr_C
      t_cold: tcws_1_C
