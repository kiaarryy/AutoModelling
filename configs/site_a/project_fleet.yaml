dataset: site_a
data_root: ${AUTOFMU_DATA_ROOT}
adapters_dir: adapters
outputs_dir: ../../outputs
fmu_config_dir: ../fmu
thresholds:
  run_on: 0.5
  min_full_physical_rows: 500
  min_nominal_rows: 200
  min_calibration_rows: 200
  validation_fold: 3
  validation_split: interleaved
  # M-09: buffered, block-interleaved identification / selection / test split.
  # Presence of this block switches the device engines off the legacy contiguous
  # 60/20/20 chronological split, whose test segment was always the tail of the
  # record -- a different season from training, with no gap in between.
  # Devices whose record cannot fill all three segments are reported as
  # degraded rather than given a test score.
  split:
    mode: proportional
    buffer_hours: 72
    n_blocks: 12
    block_pattern: [identification, test, selection, test]
    min_identification_rows: 288
    min_selection_rows: 288
    min_test_rows: 2016
devices:
- id: CH_01
  type: chiller
  adapter: chiller_ch_01.yaml
- id: CH_02
  type: chiller
  adapter: chiller_ch_02.yaml
- id: CH_03
  type: chiller
  adapter: chiller_ch_03.yaml
- id: CH_04
  type: chiller
  adapter: chiller_ch_04.yaml
- id: CH_05
