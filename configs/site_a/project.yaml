# Second dataset (Goal 1 reusability proof): Site A / GS plant.
# Structurally different from Tencent (different raw column names, flow in L/s,
# power in kW) -- handled by config + adapters ONLY, no code change.
# Real data stays external & read-only under FMU_Modelica.
dataset: site_a
data_root: ${AUTOFMU_DATA_ROOT}
adapters_dir: adapters
outputs_dir: ../../outputs
# device-type FMU interface contracts (FMU-driven L3); resolved relative to this
# config dir. When present and the FMU is available, L3 drives the real FMU.
fmu_config_dir: ../fmu

thresholds:
  run_on: 0.5
  min_full_physical_rows: 500
  min_nominal_rows: 200
  validation_split: interleaved
  validation_fold: 3

devices:
  # chillers act as the flow sources (they meter chw and cw flow)
  - {id: CH_01, type: chiller, adapter: chiller_ch_01.yaml}
  - {id: CH_02, type: chiller, adapter: chiller_ch_02.yaml}
  - {id: CH_03, type: chiller, adapter: chiller_ch_03.yaml}
  # condenser-water pump: group cdwp, attribute summed chiller cw flow on solo windows
  - id: CDWP_01
    type: pump
    group: cdwp
    adapter: pump_cdwp_01.yaml
    flow_attribution: {source_type: chiller, source_column: cw_flow_m3_h}
  # chilled-water pump: group chwp, attribute summed chiller chw flow
  - id: CHWP_01
    type: pump
    group: chwp
    adapter: pump_chwp_01.yaml
    flow_attribution: {source_type: chiller, source_column: chw_flow_m3_h}
  - id: CT_01
    type: cooling_tower
    adapter: cooling_tower_ct_01.yaml
    flow_attribution: {source_type: chiller, source_column: cw_flow_m3_h}
    join:
      - source_csv: WET_BALL/OUTDOOR/Local_IO.RF1-OUTDOOR_202405_202504_with_Twb.csv
        timestamp: DateTime
        column: "Twb (°C)"
        as: twb_C
    reconstruct:
      # active fan/cell count (logical, per-timestamp) -- replaces hard-coded x2
      fans_on_count: {method: active_count, signals: [fan1_Hz, fan2_Hz], threshold: 5.0}
      heat_rejection_W: {method: heat_rate, flow: attributed_flow_m3_h, t_hot: tcwr_C, t_cold: tcws_1_C}
  # fully metered HX (own flow meters on both sides) -> Q computable directly,
  # two-side Q gives a built-in energy-conservation check
  - id: HX_01
    type: heat_exchanger
    adapter: heat_exchanger_hx_01.yaml
    reconstruct:
      Q_W: {method: heat_rate, flow: chw_flow_m3_h, t_hot: tchwr_C, t_cold: tchws_C}
      Q_cond_W: {method: heat_rate, flow: cw_flow_m3_h, t_hot: tcwr_C, t_cold: tcws_C}
